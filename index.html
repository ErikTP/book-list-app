<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bokvänner</title>
    <link rel="stylesheet" href="styles.css" />
    <script src="script.js" defer></script>
  </head>
  <body>
    <h1 class="main-heading">BOKVÄNNER</h1>
    <section class="app-section" id="app">
      <form action="" id="inputForm">
        <label class="form-label" for="inputTitle">TITEL:</label>
        <input
          type="text"
          id="inputTitle"
          name="inputTitle"
          placeholder="Skriv här en titel..."
        />

        <label class="form-label" for="inputAuthor">FÖRFATTARE:</label>
        <input
          type="text"
          id="inputAuthor"
          name="inputAuthor"
          placeholder="Skriv här en författare..."
        />

        <label class="form-label" for="inputGenre">GENRE:</label>
        <input
          type="text"
          id="inputGenre"
          name="inputGenre"
          placeholder="Skriv här en genre..."
        />

        <!-- <label class="form-label" for="inputStatus">STATUS:</label>
        <select class="select-status" id="inputStatus">
          <option value="Tillgänglig">Tillgänglig</option>
          <option value="Utlånad">Utlånad</option>
          <option value="Reserverad">Reserverad</option>
        </select> -->

        <div class="button-container">
          <button class="button" type="submit">Lägg till</button>
        </div>
      </form>

      <ul id="itemList">
        <label class="form-label">BOKLISTA:</label>
      </ul>
    </section>
  </body>
</html>
