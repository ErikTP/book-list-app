<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bokvänner</title>
    <link rel="stylesheet" href="styles.css" />
    <script src="script.js" defer></script>
  </head>
  <body>
    <h1 class="main-heading">BOKVÄNNER</h1>
    <section class="app-section" id="app">
      <form action="" id="inputForm">
        <label class="form-label" for="inputItem">TITEL:</label>
        <input
          type="text"
          id="inputItem"
          name="inputItem"
          placeholder="Skriv här en titel..."
        />
        <label class="form-label" for="inputItem">FÖRFATTARE:</label>
        <input
          type="text"
          id="inputItem"
          name="inputItem"
          placeholder="Skriv här en författare..."
        />
        <label class="form-label" for="inputItem">GENRE:</label>
        <input
          type="text"
          id="inputItem"
          name="inputItem"
          placeholder="Skriv här en genre..."
        />
        <!-- <label class="form-label" for="Status">STATUS:</label>
        <select class="select-status" id="Status">
          <option value="Tillgänglig">Tillgänglig</option>
          <option value="Utlånad">Utlånad</option>
          <option value="Reserverad">Reserverad</option>
        </select> -->
        <div class="button-container">
          <button class="button" type="submit">Lägg till</button>
        </div>
      </form>
      <ul id="itemList">
        <label class="form-label">BOKLISTA:</label>
      </ul>
    </section>
  </body>
</html>
